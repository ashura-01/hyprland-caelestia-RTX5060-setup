# ~/.config/kitty/kitty.conf
# Refined Modern UI for Hyprland/Wayland (EndeavourOS)

#: Font Setup --------------------------------------------------

font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        9

disable_ligatures cursor

#: Cursor UI ----------------------------------------------------

cursor                  #DEADFF
cursor_text_color       #11151c
cursor_shape            beam
cursor_beam_thickness   1.8
cursor_blink_interval   0.5
cursor_trail            3
cursor_trail_decay      0.1 0.4

#: Hyprland / Wayland Window Geometry --------------------------

window_padding_width         12 16
hide_window_decorations      yes
confirm_os_window_close      0
resize_debounce_time         0.001
linux_display_server         wayland

background_opacity          0.74
background_blur             0
dynamic_background_opacity  yes

#: Panes / Splits ----------------------------------

enabled_layouts          splits,stack
window_border_width      0.55px
draw_minimal_borders     yes
window_margin_width      0
single_window_margin_width 0
inactive_text_alpha      0.80

active_border_color      #DEADFF
inactive_border_color    #575757
bell_border_color        #d4414c

#: Modern Custom Tab Bar ----------------------------------------

tab_bar_edge             bottom
tab_bar_style            custom
tab_bar_align            left
tab_bar_min_tabs         1
tab_bar_margin_width     8.0
tab_bar_margin_height    6.0 0.0
tab_title_max_length     30

# Custom Tab Formats (Uses Nerd Font Glyphs)
tab_title_template        "  󰓩 {index}  {fmt.bold}{title}{fmt.nobold} "
active_tab_title_template "  󰞷 {index}  {fmt.bold}{title}{'  󰁌' if layout_name == 'stack' else ''} "

active_tab_font_style     bold
inactive_tab_font_style   normal

active_tab_foreground     #11151c
active_tab_background     #DEADFF
inactive_tab_foreground   #7f9cc4
inactive_tab_background   #1b212b

# Transparent tab bar: sentinel color made see-through (must match BAR_BG in tab_bar.py)
tab_bar_background        none
transparent_background_colors #010203@0.0

#: Scrollback & Performance -----------------------------------

scrollback_lines         25000
repaint_delay            6
input_delay              1
sync_to_monitor          yes

#: Shell Integration & Mouse ----------------------------------

shell_integration        enabled
mouse_hide_wait          2.0
url_style                curly
detect_urls              yes
copy_on_select           clipboard
strip_trailing_spaces    smart
dynamic_title            yes

#: Color Scheme — Steel & Crimson -------------------------------

foreground               #D7CAEF
background               #110B17
selection_foreground     #11151c
selection_background     #9db4d3
url_color                #7fb5bd

# Black
color0  #1b212b
color8  #3a4454

# Red
color1  #d4414c
color9  #e5646d

# Green
color2  #8fb89a
color10 #a6cdb1

# Yellow
color3  #d9b26f
color11 #e8c78a

# Blue
color4  #7f9cc4
color12 #9db4d3

# Magenta
color5  #a591c6
color13 #bba9d9

# Cyan
color6  #7fb5bd
color14 #9ccbd2

# White
color7  #cfd6e2
color15 #eef2f8

#: Audio & Visual Bell -----------------------------------------

enable_audio_bell        no
visual_bell_duration     0.15
visual_bell_color        #d4414c

#: Keybindings -------------------------------------------------

# Font Resizing
map ctrl+shift+equal     change_font_size all +1.0
map ctrl+shift+minus     change_font_size all -1.0
map ctrl+shift+0         change_font_size all 0

# Tab Navigation
map ctrl+shift+t         new_tab_with_cwd
map ctrl+shift+q         close_tab
map alt+1                goto_tab 1
map alt+2                goto_tab 2
map alt+3                goto_tab 3
map alt+4                goto_tab 4
map alt+5                goto_tab 5
map ctrl+shift+right     next_tab
map ctrl+shift+left      previous_tab

# Splits (tmux-style)
map ctrl+alt+backslash   launch --location=vsplit --cwd=current
map ctrl+alt+minus       launch --location=hsplit --cwd=current
map ctrl+shift+w         close_window

# Split Navigation (Alt + Arrow Keys)
map alt+left             neighboring_window left
map alt+right            neighboring_window right
map alt+up               neighboring_window up
map alt+down             neighboring_window down

# Split Resizing
map ctrl+alt+left        resize_window narrower 3
map ctrl+alt+right       resize_window wider 3
map ctrl+alt+up          resize_window taller 3
map ctrl+alt+down        resize_window shorter 3

# Zoom Split (Toggle Stack)
map ctrl+shift+z         toggle_layout stack

# Scrollback Pager
map ctrl+shift+h         show_scrollback
