# ==============================================================================
#  TMUX CONFIGURATION — Whitish-Purple Mocha (Slim Capsules)
# ==============================================================================

# ==============================================================================
#  1. KEYBINDINGS & NAVIGATION
# ==============================================================================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind , run-shell '
  tmux set -g @prev_status_left "$(tmux show -gv status-left)"
  tmux set -g @prev_status_right "$(tmux show -gv status-right)"
  tmux set -g @prev_win_fmt "$(tmux show -gv window-status-format)"
  tmux set -g @prev_win_cur_fmt "$(tmux show -gv window-status-current-format)"
  tmux set -g @prev_msg_style "$(tmux show -gv message-style)"
  tmux set -g @prev_msg_cmd_style "$(tmux show -gv message-command-style)"

  tmux set -g status-left ""
  tmux set -g status-right ""
  tmux setw -g window-status-format ""
  tmux setw -g window-status-current-format ""
  tmux set -g message-style "fg=#C0B3FC,bg=default,bold"
  tmux set -g message-command-style "fg=#C0B3FC,bg=default,bold"

  # tmux command-prompt -I "#W" -p "Rename window:" "rename-window -- %%"
  tmux command-prompt -I "#W" -p "Rename window:" "rename-window -- '%%'"

  tmux set -g status-left "$(tmux show -gv @prev_status_left)"
  tmux set -g status-right "$(tmux show -gv @prev_status_right)"
  tmux setw -g window-status-format "$(tmux show -gv @prev_win_fmt)"
  tmux setw -g window-status-current-format "$(tmux show -gv @prev_win_cur_fmt)"
  tmux set -g message-style "$(tmux show -gv @prev_msg_style)"
  tmux set -g message-command-style "$(tmux show -gv @prev_msg_cmd_style)"
'

# ==============================================================================
#  2. GENERAL STATUS BAR BEHAVIOR
# ==============================================================================
set -g status-position bottom
set -g status-justify centre
set -g status-interval 2
set -g status-style "bg=default,none"

# ==============================================================================
#  3. PANE BORDERS, COPY MODE & COMMAND MESSAGES
# ==============================================================================
set -g pane-border-style "fg=#534C61"
set -g pane-active-border-style "fg=#857DAB"
set -g mode-style "fg=#1e1e2e,bg=#cdd6f4"

set -g message-style "fg=#C0B3FC,bg=default,bold"
set -g message-command-style "fg=#C0B3FC,bg=default,bold"

# ==============================================================================
#  4. STATUS BAR — LEFT & RIGHT MODULES
# ==============================================================================
set -g status-left-length 100
set -g status-left "#[fg=#D7B8FF,bg=default]#[fg=#D3CFFF,bg=default,bold] #S #[fg=#FFC9C9,bg=default,bold]  #{?USER,#{USER},#(id -un)}:#H   #[fg=default]"

set -g status-right-length 120
set -g status-right "#(VPN_IP=\$(ip -4 addr show dev tun0 2>/dev/null | awk '/inet / {print \$2}' | cut -d/ -f1); if [ -z \"\$VPN_IP\" ]; then VPN_IP=\$(ip -4 addr show dev wg0 2>/dev/null | awk '/inet / {print \$2}' | cut -d/ -f1); fi; if [ -n \"\$VPN_IP\" ]; then echo \"#[fg=#A6E3A1,bold] \$VPN_IP\"; else SYS_IP=\$(ip -4 addr show 2>/dev/null | awk '/inet / && !/127.0.0.1/ {print \$2}' | cut -d/ -f1 | head -n 1); if [ -n \"\$SYS_IP\" ]; then echo \"#[fg=#FFC9C9,bold] \$SYS_IP\"; else echo \"#[fg=#F38BA8,bold]❌ Offline\"; fi; fi)  #[fg=#D3CFFF,bg=default,bold] %I:%M %p#[fg=default]"

# ==============================================================================
#  5. WINDOW TABS (SLIM SLANTED CAPSULES)
# ==============================================================================
set -g status-style "bg=default,none"
set -g status-bg default
setw -g window-status-style "bg=default"
setw -g window-status-current-style "bg=default"

setw -g window-status-separator " "

setw -g window-status-format "#[fg=#313244,bg=default]#[fg=#a6adc8,bg=#313244] #W ⎮ #I#[fg=#313244,bg=default]"

setw -g window-status-current-format "#[fg=#C0B3FC,bg=default]#[fg=#000000,bg=#C0B3FC,bold] #W #{?window_zoomed_flag, 🔍,}#[fg=#000000,bg=#A691FF,nobold]▎#[fg=#000000,bg=#A691FF,bold]#I#[fg=#A691FF,bg=default]"
