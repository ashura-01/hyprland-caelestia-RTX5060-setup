# ==============================================================================
#  TMUX CONFIGURATION — Whitish-Purple Mocha (Slim Capsules)
# ==============================================================================
#  PALETTE CHEAT SHEET (Catppuccin Mocha / Custom Mauve)
#  ----------------------------------------------------------------------------
#  #1e1e2e : Base Dark (Used for high-contrast text inside bright pills)
#  #313244 : Surface0  (Inactive tab background)
#  #534C61 : Muted Purple (Inactive pane border)
#  #857DAB : Soft Mauve   (Active pane border)
#  #a6adc8 : Subtext0     (Inactive tab text)
#  #C0B3FC : Light Mauve  (Active tab window name background)
#  #A691FF : Deep Mauve   (Active tab index background & right slant)
#  #D3CFFF : Lavender     (Session name & clock text)
#  #FFC9C9 : Pastel Pink  (User@Host & Local IP text)
#  #A6E3A1 : Mint Green   (Active VPN IP text)
#  #F38BA8 : Coral Red    (Offline status text)
# ==============================================================================


# ==============================================================================
#  1. KEYBINDINGS & NAVIGATION
# ==============================================================================
# Split panes horizontally (|) and vertically (-) in the current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Fast pane switching using Alt + Arrow Keys (no prefix required)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D


# ==============================================================================
#  2. GENERAL STATUS BAR BEHAVIOR
# ==============================================================================
set -g status-position bottom        # Place bar at the bottom of the terminal
set -g status-justify centre         # Center the window tabs
set -g status-interval 2             # Refresh status scripts (like IP/clock) every 2s
set -g status-style "bg=default,none" # Transparent background (inherits terminal bg)


# ==============================================================================
#  3. PANE BORDERS, COPY MODE & COMMAND MESSAGES
# ==============================================================================
set -g pane-border-style "fg=#534C61"        # Inactive pane border
set -g pane-active-border-style "fg=#857DAB" # Active pane border
set -g mode-style "fg=#1e1e2e,bg=#cdd6f4"    # Text selection / copy-mode highlight
set -g message-style "fg=#1e1e2e,bg=#CE9EFF" # Tmux command prompt & alert messages


# ==============================================================================
#  4. STATUS BAR — LEFT & RIGHT MODULES
# ==============================================================================
# --- LEFT: [Session Name] + [User@Hostname] ---
set -g status-left-length 100
set -g status-left "#[fg=#D7B8FF,bg=default]#[fg=#D3CFFF,bg=default,bold] #S #[fg=#FFC9C9,bg=default,bold]  #(whoami):#H   #[fg=default]"

# --- RIGHT: [Smart VPN/Local IP] + [12-Hour Clock] ---
# Logic:
#   1. Checks for active VPN interfaces (tun0, then wg0) -> Displays in Mint Green (#A6E3A1)
#   2. Falls back to primary non-loopback local IP        -> Displays in Pastel Pink (#FFC9C9)
#   3. If no network interface has an IP                 -> Displays Offline in Red (#F38BA8)
set -g status-right-length 120
set -g status-right "#(VPN_IP=\$(ip -4 addr show dev tun0 2>/dev/null | awk '/inet / {print \$2}' | cut -d/ -f1); if [ -z \"\$VPN_IP\" ]; then VPN_IP=\$(ip -4 addr show dev wg0 2>/dev/null | awk '/inet / {print \$2}' | cut -d/ -f1); fi; if [ -n \"\$VPN_IP\" ]; then echo \"#[fg=#A6E3A1,bold] \$VPN_IP\"; else SYS_IP=\$(ip -4 addr show 2>/dev/null | awk '/inet / && !/127.0.0.1/ {print \$2}' | cut -d/ -f1 | head -n 1); if [ -n \"\$SYS_IP\" ]; then echo \"#[fg=#FFC9C9,bold] \$SYS_IP\"; else echo \"#[fg=#F38BA8,bold]❌ Offline\"; fi; fi)  #[fg=#D3CFFF,bg=default,bold] %I:%M %p#[fg=default]"


# ==============================================================================
#  5. WINDOW TABS (SLIM SLANTED CAPSULES)
# ==============================================================================
# NOTE: Keep this section at the very bottom of tmux.conf (after `run '~/.tmux/plugins/tpm/tpm'`)
#       so third-party plugins do not overwrite your transparency or tab formatting.

# Enforce transparent background inheritance across all tab states
set -g status-style "bg=default,none"
set -g status-bg default
setw -g window-status-style "bg=default"
setw -g window-status-current-style "bg=default"

# Space between each window capsule
setw -g window-status-separator " "

# --- INACTIVE WINDOW TAB ---
# Anatomy: [Left Slant ] + [Window Name (#W) ⎮ Index (#I)] + [Right Slant ]
setw -g window-status-format "#[fg=#313244,bg=default]#[fg=#a6adc8,bg=#313244]#W ⎮ #I#[fg=#313244,bg=default]"

# --- ACTIVE WINDOW TAB ---
# Anatomy: [Left Slant ] + [Window Name (#W) + Zoom Icon 🔍] + [Divider ▎] + [Index (#I)] + [Right Slant ]
# Tip: To change the active tab color, update BOTH the `fg=` on the slant glyphs ( / ) and the `bg=` on the text blocks.
setw -g window-status-current-format "#[fg=#C0B3FC,bg=default]#[fg=#1e1e2e,bg=#C0B3FC,bold] #W #{?window_zoomed_flag, 🔍,}#[fg=#1e1e2e,bg=#A691FF,nobold]▎#[fg=#000000,bg=#A691FF,bold]#I#[fg=#A691FF,bg=default]"
